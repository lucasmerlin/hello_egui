[package]
name = "egui_webview"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
egui.workspace = true
egui_inbox = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wry = "0.55.0"
http = "1"
egui-wgpu = { version = "0.36.0", features = ["winit"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { version = "0.36.0", features = ["paint-planes"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "console",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "Node",
  "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions wry uses, so the `WKWebView` it hands out is the same type.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "NSResponder", "NSView"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CALayer", "CAShapeLayer", "CATransaction"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPath"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[dev-dependencies]
eframe = { workspace = true, default-features = true }
egui_extras = { workspace = true, features = ["image"] }

[lints]
workspace = true
