[package]
name = "egui_dnd"
version = "0.17.0"
edition = "2021"
authors = ["Lucas Meurer"]
repository = "https://github.com/lucasmerlin/hello_egui/tree/main/crates/egui_dnd"
homepage = "https://lucasmerlin.github.io/hello_egui/"
keywords = ["egui", "drag", "drop", "ui", "gui"]
categories = ["gui"]
description = "A drag and drop library for egui"
license = "MIT"


[dependencies]
egui_animation.workspace = true
egui.workspace = true
simple-easing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
# Dev-deps on other workspace crates use a path without a version, so cargo
# drops them from the published manifest and the publish order can ignore them.
egui_infinite_scroll = { path = "../egui_infinite_scroll" }
egui_virtual_list = { path = "../egui_virtual_list" }
hello_egui_utils = { path = "../hello_egui_utils" }
rand.workspace = true

egui_extras.workspace = true
color-hex = "0.2.0"
egui = { workspace = true, features = ["color-hex"] }
eframe = { workspace = true, default-features = true }

[lints]
workspace = true
