[package]
name = "egui_virtual_list"
version = "0.12.0"
edition = "2021"
authors = ["Lucas Meurer"]
homepage = "https://lucasmerlin.github.io/hello_egui/#/example/gallery"
repository = "https://github.com/lucasmerlin/hello_egui/tree/main/crates/egui_virtual_list"
license = "MIT"
description = "A virtual list widget for egui, with support for variable height items."
keywords = ["egui", "virtual_list", "list", "ui"]

[dependencies]
egui.workspace = true
web-time = "1"

[dev-dependencies]
eframe = { workspace = true, default-features = true }
rand.workspace = true
# Dev-deps on other workspace crates use a path without a version, so cargo
# drops them from the published manifest and the publish order can ignore them.
hello_egui_utils_dev = { path = "../hello_egui_utils_dev" }

[lints]
workspace = true
