[package]
name = "egui_pull_to_refresh"
version = "0.13.0"
edition = "2021"
description = "A pull to refresh library for egui"
license = "MIT"
repository = "https://github.com/lucasmerlin/hello_egui/tree/main/crates/egui_pull_to_refresh"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui.workspace = true

[dev-dependencies]
eframe = { workspace = true, default-features = true }
# Dev-deps on other workspace crates use a path without a version, so cargo
# drops them from the published manifest and the publish order can ignore them.
egui_inbox = { path = "../egui_inbox" }
ehttp.workspace = true

[lints]
workspace = true
